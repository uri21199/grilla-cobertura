[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# 00:00 UTC = 21:00 ART (Argentina no usa horario de verano).
[functions."notificar-nocturno"]
  schedule = "0 0 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
